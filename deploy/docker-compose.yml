# Scribe plus a model server, for the N100.
#
# Two containers rather than one on purpose: the model is the part you will want to change —
# try Florence-2, then TrOCR, then whatever is best in six months — and behind an HTTP boundary
# that is a config change instead of a rebuild.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#   docker compose run --rm scribe -check     # verify before letting it loose on the library

services:
  scribe:
    build: ..
    container_name: scribe
    restart: unless-stopped
    depends_on:
      - model
    environment:
      SCRIBE_COUCH_URL: ${SCRIBE_COUCH_URL}
      SCRIBE_COUCH_USER: ${SCRIBE_COUCH_USER}
      SCRIBE_COUCH_PASSWORD: ${SCRIBE_COUCH_PASSWORD}
      SCRIBE_NOTES_DB: ${SCRIBE_NOTES_DB:-notes}
      SCRIBE_TEXT_DB: ${SCRIBE_TEXT_DB:-notes_text}
      SCRIBE_MODEL_URL: ${SCRIBE_MODEL_URL:-http://model:4000/v1}
      SCRIBE_MODEL: ${SCRIBE_MODEL}
      SCRIBE_MODEL_STRONG: ${SCRIBE_MODEL_STRONG:-}
      SCRIBE_MODEL_TIMEOUT: ${SCRIBE_MODEL_TIMEOUT:-5m}
      SCRIBE_LANGUAGE: ${SCRIBE_LANGUAGE:-en}
      SCRIBE_DEVICE_ID: ${SCRIBE_DEVICE_ID:-server}
      SCRIBE_POLL: ${SCRIBE_POLL:-30s}
      SCRIBE_STATE: /var/lib/scribe/state.json
      SCRIBE_LOG_LEVEL: ${SCRIBE_LOG_LEVEL:-info}
    volumes:
      - scribe-state:/var/lib/scribe
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # scribe speaks OpenAI /chat/completions; litellm translates that to Anthropic's Messages
  # API. scribe is unchanged and unaware — swapping which model answers is a line in
  # litellm.yaml, and swapping back to a local model is a change to SCRIBE_MODEL_URL.
  #
  # The N100's CPU needs ~10 minutes per page for a 3B local vision model and reads cursive
  # badly; Haiku answers in ~1.5s. See the README on why the iGPU does not close that gap.
  #
  # To go back to a local model instead, restore the ollama service from git history and point
  # SCRIBE_MODEL_URL at http://model:11434/v1.
  model:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: scribe-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Read by litellm, never by scribe. Lives in .env, which is gitignored.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scribe-state:
